name: YouTube sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_youtube.py"

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch channel feed
        run: python scripts/sync_youtube.py
      - name: Commit when the channel changed
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          new = json.loads(pathlib.Path('data/youtube.json').read_text(encoding='utf-8'))
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/youtube.json'], text=True))
          except Exception:
              old = {}
          def signature(data):
              live = data.get('live') or {}
              return {'videos': data.get('videos'), 'live': {key: live.get(key) for key in ('isLive', 'videoId')}}
          pathlib.Path('_state_changed').write_text('1' if signature(new) != signature(old) else '')
          PY
          if [ -s _state_changed ]; then
            git config user.name 'youtube-sync[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/youtube.json
            git commit -m 'chore: sync YouTube feed'
            git push
          else
            echo 'No channel changes'
          fi
