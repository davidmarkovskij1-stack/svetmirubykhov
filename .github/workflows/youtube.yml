name: YouTube sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_youtube.py"

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch channel feed
        run: python scripts/sync_youtube.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/youtube.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "youtube-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git commit -m "chore: sync YouTube feed"
          git push
